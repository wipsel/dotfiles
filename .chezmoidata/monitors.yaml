# Per-host monitor layouts, read by dot_config/hypr/hyprland.lua.tmpl as `.monitors`,
# keyed by hostname. A new host is an unmergeable hardware difference: add its entry
# here from `hyprctl monitors` (the `desc:` strings), then `chezmoi apply`.
# Hosts without an entry fall back to a preferred/auto catch-all.
#
# Fields map 1:1 onto hl.monitor(): output, mode, position, scale, transform.
# Only `output` is mandatory; anything omitted falls back to Hyprland's default.
# `workspaces` binds those workspaces to the screen while it is connected; the first
# one is what the screen opens on.

monitors:
  obelix:
    - output: "desc:Lenovo Group Limited 0x8AC2"
      mode: preferred
      position: "0x0"
      scale: 1.9166
      workspaces: [10]
    # At home
    - output: "desc:Samsung Electric Company LS24D60xU HNAY201650"
      mode: "2560x1440@100"
      position: "1840x0"
      scale: 1.333
      workspaces: [1, 2]
    - output: "desc:Samsung Electric Company LS24D60xU HNAXC01129"
      mode: "2560x1440@100"
      position: auto
      scale: 1.333
      transform: 1
      workspaces: [3, 4, 5, 6, 7, 8, 9]
    # Groningen
    - output: "desc:Samsung Electric Company LS24D60xU HNAYC00326"
      mode: "2560x1440@100"
      position: "1840x0"
      scale: 1.333
      workspaces: [1, 2]
    - output: "desc:Samsung Electric Company LS24D60xU HNAYC00417"
      mode: "2560x1440@100"
      position: auto
      scale: 1.333
      transform: 1
      workspaces: [3, 4, 5, 6, 7, 8, 9]
